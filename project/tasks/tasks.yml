# Общие настройки заданий мини-курса (читает _tools/taskctl.py).

# Формат флага — регулярное выражение для полного совпадения.
flag_format: 'BootCTF\{[A-Za-z0-9_!?.+-]{4,64}\}'

# Категории = подкаталоги project/tasks/. Новую категорию добавлять и сюда, и каталогом.
categories:
  - crypto      # криптография
  - forensics   # компьютерная криминалистика: дампы, трафик, образы
  - misc        # разное
  - osint       # поиск по открытым источникам
  - pwn         # эксплуатация бинарных уязвимостей
  - reverse     # обратная разработка
  - stego       # стеганография
  - web         # веб-уязвимости

# Коллекции — подкаталоги project/tasks/, объединяющие задания одной лекции
# (например, короткий CTF). Внутри коллекции каталог задания называется
# <категория>-<имя>, а категория берётся из task.yml. Подробности — в README.md.
collections:
  - lecture-1   # демонстрационный CTF вводной лекции 01-intro

difficulties: [easy, medium, hard]
