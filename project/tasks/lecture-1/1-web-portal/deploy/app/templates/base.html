<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Портал — Северный маяк</title>
  {%- block head %}{% endblock %}
  <style>
    :root {
      --ink: #0f1f2e; --muted: #5d6b7a; --line: #dfe6ec; --surface: #ffffff;
      --accent: #0b7a6b; --accent-dark: #075e53; --accent-soft: #e6f4f1; --navy: #0c2f4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
      background:
        radial-gradient(60rem 30rem at 85% -10%, #d7efe9 0%, transparent 60%),
        radial-gradient(50rem 28rem at -10% 20%, #dde9f5 0%, transparent 55%),
        #f3f6f9;
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .25rem 1.5rem;
      padding: .9rem max(1.25rem, calc(50vw - 30rem));
      background: rgba(255, 255, 255, .85); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; display: flex; align-items: center; gap: .65rem; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; color: var(--navy); }
    h1::before {
      content: ""; width: 1.9rem; height: 1.9rem; border-radius: .55rem;
      background:
        radial-gradient(circle at 50% 38%, #fff 0 16%, transparent 17%),
        linear-gradient(135deg, #12a08c, var(--navy));
      box-shadow: 0 2px 6px rgba(12, 47, 74, .25);
    }
    header p { margin: 0; font-size: .85rem; }
    .muted { color: var(--muted); }
    main {
      align-self: start; width: min(100% - 2rem, 40rem); margin: 3.5rem auto 2rem; padding: 2.25rem 2.5rem;
      background: var(--surface); border: 1px solid var(--line); border-radius: 1rem;
      box-shadow: 0 1px 2px rgba(15, 31, 46, .04), 0 12px 32px rgba(15, 31, 46, .08);
    }
    main > :first-child { margin-top: 0; }
    main > :last-child { margin-bottom: 0; }
    a { color: var(--accent); font-weight: 500; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      font: .875em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #eef2f6; border: 1px solid var(--line); padding: .1rem .4rem; border-radius: .35rem;
    }
    form { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.75rem 0; }
    label { flex-basis: 100%; font-size: 1.25rem; font-weight: 650; letter-spacing: -.01em; color: var(--navy); }
    input[type=text] {
      flex: 1 1 14rem; min-width: 0; font: inherit; color: inherit; padding: .65rem .9rem;
      background: #fff; border: 1px solid #c5d0da; border-radius: .6rem; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=text]::placeholder { color: #9aa7b4; }
    input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(11, 122, 107, .15); }
    button {
      font: inherit; font-weight: 600; color: #fff; padding: .65rem 1.3rem; cursor: pointer;
      background: var(--accent); border: 0; border-radius: .6rem;
      box-shadow: 0 1px 2px rgba(7, 94, 83, .35); transition: background .15s, transform .05s;
    }
    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }
    ul { list-style: none; margin: 1.75rem 0 0; padding: 0; }
    li {
      padding: .7rem 1rem; font-size: .92rem; color: #2c4a45;
      background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: .5rem;
    }
    li + li { margin-top: .5rem; }
    .greeting { margin: 0 0 1.25rem; font-size: 1.75rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; color: var(--navy); overflow-wrap: anywhere; }
    footer { padding: 1.5rem 1rem 2rem; text-align: center; font-size: .82rem; color: #8493a2; }
    @media (max-width: 30rem) { main { padding: 1.5rem 1.25rem; margin-top: 1.5rem; } button { flex: 1 1 100%; } }
  </style>
</head>
<body>
  <header>
    <h1>Портал клиента</h1>
    <p class="muted">ООО «Северный маяк» · внутренний сервис</p>
  </header>

  <main>
{% block content %}{% endblock %}
  </main>

  <footer>
    © Северный маяк. Тестовый стенд мини-курса по CTF.
  </footer>
{% block scripts %}{% endblock %}
</body>
</html>
