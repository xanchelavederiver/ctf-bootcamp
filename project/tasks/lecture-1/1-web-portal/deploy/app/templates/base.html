<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Портал — Северный маяк</title>
  {%- block head %}{% endblock %}
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; color: #1a2330; }
    header { border-bottom: 2px solid #0a6; padding-bottom: .5rem; }
    h1 { color: #084; margin: 0; }
    .muted { color: #667; }
    code { background: #eef2f5; padding: .1rem .3rem; border-radius: .2rem; }
    form { margin: 1.5rem 0; }
    label { display: block; margin-bottom: .4rem; }
    input[type=text] { font: inherit; padding: .35rem .5rem; border: 1px solid #9ab; border-radius: .25rem; width: 16rem; max-width: 60%; }
    button { font: inherit; padding: .35rem .9rem; border: 0; border-radius: .25rem; background: #084; color: #fff; cursor: pointer; }
    .greeting { font-size: 1.3rem; margin: 1.5rem 0; }
    footer { margin-top: 3rem; color: #889; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Портал клиента</h1>
    <p class="muted">ООО «Северный маяк» · внутренний сервис</p>
  </header>

  <main>
{% block content %}{% endblock %}
  </main>

  <footer>
    © Северный маяк. Тестовый стенд мини-курса по CTF.
  </footer>
{% block scripts %}{% endblock %}
</body>
</html>
