# «Портал» (web). Запуск в одиночку:  docker compose up --build
# По умолчанию порт слушается только на 127.0.0.1; у лектора BIND=0.0.0.0.
# Флаги по умолчанию — flags.env.defaults.
#
# Наружу публикуется только nginx (web-portal-proxy); приложение доступно ему по
# внутренней сети. Зависшее приложение перезапускает сторож (deploy/watchdog.py).
name: ctf-web-portal
services:
  web-portal:
    build:
      context: .
    image: ctf-lecture-1/web-portal
    expose:
      - "8001"
    networks: [web-portal]
    env_file:
      - path: flags.env.defaults
        required: true
      - path: ../../flags.real.env
        required: false
    tmpfs:
      - /tmp
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

  web-portal-proxy:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine
    ports:
      - "${BIND:-127.0.0.1}:8001:8080"
    networks: [web-portal]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web-portal:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

networks:
  web-portal:
