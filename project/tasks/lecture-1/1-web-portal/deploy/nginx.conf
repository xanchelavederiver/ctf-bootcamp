# Обратный прокси перед gunicorn: принимает соединения от клиентов, дожидается
# полного запроса и только потом передаёт его приложению. Медленные и оборванные
# клиенты отсекаются тайм-аутами и не занимают потоки gunicorn.

# Имя web-portal перерешается через DNS Docker: после перезапуска контейнер приложения
# может получить новый IP (параметр resolve — nginx ≥ 1.27.3).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream portal {
    zone portal 64k;
    server web-portal:8001 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;

    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    client_max_body_size  16k;
    large_client_header_buffers 4 16k;

    location / {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;
    }
}
