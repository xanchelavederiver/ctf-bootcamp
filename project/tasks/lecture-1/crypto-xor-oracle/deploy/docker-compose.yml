# «Шифратор» (crypto). Запуск в одиночку:  docker compose up --build
# Флаги: умолчания — deploy/flags.env.defaults; боевые — ../../flags.real.env коллекции.
name: ctf-crypto-xor-oracle
services:
  crypto-xor-oracle:
    build:
      context: .
    image: ctf-lecture-1/crypto-xor-oracle
    ports:
      - "${BIND:-127.0.0.1}:8002:8002"
    env_file:
      - path: flags.env.defaults
        required: true
      - path: ../../flags.real.env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
