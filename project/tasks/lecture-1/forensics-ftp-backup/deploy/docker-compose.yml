# «Резервная копия» (forensics) — живой FTP-сервер (альтернативный маршрут и скрытый флаг).
# Запуск в одиночку:  docker compose up --build
# Пассивный режим: порт 2121 и диапазон 30000-30009. Адрес для пассивного режима —
# FTP_PASV_ADDRESS (у лектора — адрес его машины). Скрытый флаг — через окружение.
name: ctf-forensics-ftp-backup
services:
  forensics-ftp:
    build:
      context: .
    image: ctf-lecture-1/forensics-ftp-backup
    ports:
      - "${BIND:-127.0.0.1}:2121:2121"
      - "${BIND:-127.0.0.1}:30000-30009:30000-30009"
    environment:
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS:-127.0.0.1}
    env_file:
      - path: flags.env.defaults
        required: true
      - path: ../../flags.real.env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',2121),timeout=3).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
