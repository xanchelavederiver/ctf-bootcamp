# Метаданные задания. Проверка: make tasks-check TASK=lecture-1/forensics-ftp-backup
name: "Резервная копия"
id: forensics-ftp-backup
category: forensics
difficulty: medium
points: 150
author: "Мини-курс «Введение в CTF»"
# Флаги 1 и 2 лежат в дампе трафика открытым текстом — это и есть суть задания,
# поэтому flag_in_public: true (иначе проверка сочла бы их утечкой).
flag_in_public: true
flag: "BootCTF{ftp_traffic_in_clear}"           # флаг №1: notes.txt в открытом FTP-трафике
tags: [forensics, pcap, ftp, wireshark, zip, john]
lecture: 01-intro
order: 3

flags:
  - {id: 2, flag: "BootCTF{zip_comment_not_encrypted}", points: 100, title: "Комментарий архива"}
  - {id: 3, flag: "BootCTF{zip_password_from_wordlist}", points: 150, title: "Пароль архива по словарю"}
  - {id: 4, flag: "BootCTF{default_forensics_hidden_dir}", env: FORENSICS_FLAG_HIDDEN, hidden: true, title: "Каталог на живом сервере"}

# deploy студенту не выдаётся: флаги 1–3 извлекаются из дампа, живой сервер поднимает
# лектор (альтернативный маршрут и скрытый флаг). Поэтому handout не указан.
service:
  type: tcp
  port: 2121
