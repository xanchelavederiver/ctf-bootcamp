# «Портал» (web). Запуск в одиночку:  docker compose up --build
# По умолчанию порт слушается только на 127.0.0.1; у лектора BIND=0.0.0.0.
# Флаги: умолчания — deploy/flags.env.defaults; боевые — ../../flags.real.env коллекции
# (необязательный файл; если есть, переопределяет умолчания). См. project/tasks/README.md.
name: ctf-web-portal
services:
  web-portal:
    build:
      context: .
    image: ctf-lecture-1/web-portal
    ports:
      - "${BIND:-127.0.0.1}:8001:8001"
    env_file:
      - path: flags.env.defaults
        required: true
      - path: ../../flags.real.env
        required: false
    # read_only не включаем: приложение пишет боевой флаг №6 в /flag.txt при старте.
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
